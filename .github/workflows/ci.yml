name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Lint (internal debug)
        run: ./gradlew :app:lintInternalDebug --stacktrace

      - name: Unit tests (internal debug)
        run: ./gradlew :app:testInternalDebugUnitTest --stacktrace

      - name: Assemble internal debug
        run: ./gradlew :app:assembleInternalDebug --stacktrace

      - name: Upload internal debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cloudshelf-internal-debug
          path: app/build/outputs/apk/internal/debug/*.apk
